name: Build, Push, and Deploy via Docker Context

on:
  push:
    branches:
      - main
      - codegen/dev-68-spike-诊断cicd-ssh部署失败的原因
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/my-json-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codegen/dev-68-spike-诊断cicd-ssh部署失败的原因'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Update Image Tag in Compose File
        run: |
          export NEW_IMAGE="${{ env.IMAGE_NAME }}:main-${{ github.sha }}"
          sed -i "s|image: .*|image: ${NEW_IMAGE}|" docker-compose.yml
          echo "Updated docker-compose.yml with image: ${NEW_IMAGE}"
          
      - name: Verify Docker Compose File
        run: |
          echo "=== Docker Compose File Content ==="
          cat docker-compose.yml
          echo "=================================="

      # 关键步骤：在远程服务器上登录 Docker Hub
      - name: Login to Docker Hub on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Logging into Docker Hub on remote server..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            echo "Remote server logged in successfully."
            
            # 创建部署目录
            mkdir -p /opt/my-json-api
            
            # 清理旧的镜像（保留最新的3个）
            docker image prune -f
            docker images ${{ secrets.DOCKER_USERNAME }}/my-json-api --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true

      # 设置 Docker Context 指向远程服务器
      - name: Set up Docker Context for Remote Host
        run: |
          # 创建SSH配置
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # 添加服务器到known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
          # 创建Docker Context
          docker context create remote --docker "host=ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          docker context use remote
          
          # 验证连接
          docker info

      # 传输docker-compose文件到服务器
      - name: Copy Docker Compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/my-json-api/"

      # 使用 Docker Context 进行部署
      - name: Deploy with Docker Compose
        run: |
          # 切换到远程context
          docker context use remote
          
          # 拉取最新镜像
          docker compose -f /opt/my-json-api/docker-compose.yml pull
          
          # 部署服务
          docker compose -f /opt/my-json-api/docker-compose.yml up -d --remove-orphans
          
          # 等待服务启动
          sleep 30
          
          # 验证部署
          docker compose -f /opt/my-json-api/docker-compose.yml ps

      # 健康检查
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Performing health check..."
            
            # 等待服务完全启动
            for i in {1..10}; do
              if curl -f http://localhost:3000/health; then
                echo "Health check passed!"
                break
              else
                echo "Health check attempt $i failed, retrying in 10 seconds..."
                sleep 10
              fi
            done
            
            # 显示容器状态
            docker ps | grep my-json-api
            
            # 显示最近的日志
            docker logs my-json-api --tail 50

      # 清理Docker Context
      - name: Cleanup Docker Context
        if: always()
        run: |
          docker context use default
          docker context rm remote || true
          rm -f ~/.ssh/deploy_key
